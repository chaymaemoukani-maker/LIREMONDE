<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>LireMonde</title>
  <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<nav class="navbar">
<h1 class="logo-text">
  <i class="fa-solid fa-book-open"></i> LIREMONDE
</h1>
  <div class="nav-links">
    <a href="index.html">Accueil</a>
    <a href="#alire">À lire</a>
    <a href="admin.html">Admin</a>
   
  </div>
 <input type="text" id="search" placeholder="Rechercher...">
</nav>

<div class="categories">
  <button class="active">Tous</button>
  <button>Classique</button>
  <button>Science-fiction</button>
  <button>Drame</button>
  <button>Fantasy</button>
</div>
<section id="booksContainer" class="grid"></section>
<div id="modal" class="modal hidden">

  <div class="modal-content">

    <img id="modalImg" class="modal-img">

    <div class="modal-info">
      <h2 id="modalTitle" class="modal-title"></h2>
      <p id="modalAuthor" class="modal-author"></p>

      <p id="modalGenre" class="modal-genre"></p>
      <p id="modalDesc" class="modal-desc"></p>

      <div class="modal-buttons">
        <button class="btn-alire" onclick="addToRead()">❤️ A lire</button>
        <button class="btn-fermer" onclick="closeModal()">Fermer</button>
      </div>
    </div>

  </div>

</div>
<section id="alire">

  <h1>À lire</h1>

  <div id="aLireContainer" class="grid"></div>

</section>
<footer>
  <p>© 2026 LireMonde - Tous droits réservés</p>
</footer>

<script src="script.js"></script>
</body>
</html>
