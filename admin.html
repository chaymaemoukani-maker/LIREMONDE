<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Admin - LireMonde</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <!-- NAVBAR (same as index) -->
  <nav class="navbar">
    <h1 class="logo-text">
      <i class="fa-solid fa-book-open"></i> LIREMONDE
    </h1>
    <div class="nav-links">
      <a href="index.html">Accueil</a>
      <a href="index.html#alire">À lire</a>
      <a href="admin.html" class="active-link">Admin</a>
    </div>
  </nav>

  <div class="container">

    <button id="showFormBtn">
      + Ajouter un livre
    </button>

    <!-- FORM -->
    <div id="formContainer" class="hidden">

      <h2 id="formTitle">Ajouter un nouveau livre</h2>

      <div class="form-group">
        <label for="titre">Titre</label>
        <input type="text" id="titre" placeholder="Titre du livre">
      </div>

      <div class="form-group">
        <label for="auteur">Auteur</label>
        <input type="text" id="auteur" placeholder="Nom de l'auteur">
      </div>

      <div class="form-group">
        <label for="genre">Genre</label>
        <select id="genre">
          <option value="">-- Choisir un genre --</option>
          <option value="Classique">Classique</option>
          <option value="Science-fiction">Science-fiction</option>
          <option value="Drame">Drame</option>
          <option value="Fantasy">Fantasy</option>
          
        </select>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" placeholder="Description du livre"></textarea>
      </div>

      <div class="form-group">
        <label for="couverture">URL de couverture</label>
        <div class="input-icon">
          <input type="url" id="couverture" placeholder="URL image" required />
         
        </div>
      </div>

      <div class="form-actions">
        <button class="btn-add" id="submitBtn" onclick="submitForm()">Ajouter</button>
        <button class="btn-cancel" onclick="cancelForm()">Annuler</button>
      </div>

    </div>

    <!-- TABLE -->
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Couverture</th>
          <th>Titre</th>
          <th>Auteur</th>
          <th>Genre</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="booksTable"></tbody>
    </table>

  </div>

  <!-- MODAL (same structure as index) -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <img id="modalImg">
      <div class="modal-info">
        <h2 id="modalTitle"></h2>
        <p id="modalAuthor"></p>
        <p id="modalGenre"></p>
        <p id="modalDesc"></p>
        <div class="modal-actions">
          <button class="btn-modal-close" onclick="closeModal()">Fermer</button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2026 LireMonde - Tous droits réservés</p>
  </footer>

  <script src="admin.js"></script>

</body>
</html>
